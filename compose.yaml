include:
  - ./proxy.yaml
services:
  db:
    image: mysql:8
    env_file:
      - .env
    ports:
      - "3306:3306"
    networks:
      backend:
        ipv4_address: 172.20.0.10
    restart: on-failure
  web:
    image: cr.yandex/crp8qecreoj84bkjau6r/python_app:latest
    networks:
      backend:
        ipv4_address: 172.20.0.5
    env_file:
      - .env
    depends_on:
      - db
    restart: on-failure

